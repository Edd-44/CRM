  function readSettingsFromDOM() {
    var s = state.modal.draft;
    document.querySelectorAll("[data-team]").forEach(function (el) { s.team[+el.dataset.team] = el.value; });
    document.querySelectorAll("[data-stage]").forEach(function (el) { s.stages[+el.dataset.stage].name = el.value; });
    var eur = num(document.getElementById("fx_eur").value);
    var usd = num(document.getElementById("fx_usd").value);
    var prevFx = state.settings.fx;
    s.fx = { GBP: 1, EUR: eur && eur > 0 ? eur : prevFx.EUR, USD: usd && usd > 0 ? usd : prevFx.USD };
    var typedDate = document.getElementById("fx_asat").value;
    var ratesMoved = s.fx.EUR !== prevFx.EUR || s.fx.USD !== prevFx.USD;
    s.fxAsAt = (ratesMoved && typedDate === state.settings.fxAsAt) ? todayISO() : typedDate;
    var cd = num(document.getElementById("cold_days").value);
    s.coldDays = cd && cd > 0 ? cd : 21;
    var ic = document.getElementById("int_compound");
    if (ic) s.interestCompounds = ic.value !== "simple";
  }

  /* ============================ export ============================ */

  function csvCell(v) {
    var s = v == null ? "" : String(v);
    return /[",\n]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s;
  }
  async function exportCSV() {
    var head = ["Name", "Contact", "Relationship", "Stage", "Responsible", "Amount", "Currency", "Amount GBP",
      "Instrument", "Interest %", "Months to conversion", "Discount %", "Valuation cap (x pre-money)", "Note terms",
      "First conversation", "Last conversation", "Targeting close", "Next steps", "Other details"];
    var lines = [head.map(csvCell).join(",")];
    sorted(targetList()).forEach(function (t) {
      lines.push([t.name, t.contact, t.relationship, stageById(t.stage).name, t.owner,
        t.amount, t.currency, t.amount == null ? "" : Math.round(toGBP(t.amount, t.currency)),
        t.instrument === "note" ? "Convertible note" : "Equity", rateOf(t), t.months, t.discount, t.capMultiple, t.noteTerms,
        t.firstConversationDate, t.lastConversationDate, t.targetCloseDate, t.nextSteps, t.notes
      ].map(csvCell).join(","));
    });
    var csv = lines.join("\r\n");
    var dl = null;
    try { dl = window.claude && window.claude.use ? await window.claude.use("downloads") : null; } catch (e) { dl = null; }
    if (dl) {
      try {
        await dl.save({ filename: "justclaim-fundraising-" + todayISO() + ".csv", data: csv });
        toast("Export ready.");
        return;
      } catch (e) {
        if (e && e.code === "declined") return;
      }
    }
    try {
      await navigator.clipboard.writeText(csv);
      toast("CSV copied to the clipboard.");
    } catch (e) {
      toast("Export is unavailable in this view.");
    }
  }

  /* ============================ events ============================ */

  document.getElementById("tabs").addEventListener("click", function (e) {
    var b = e.target.closest(".tab");
    if (!b) return;
    state.page = b.dataset.page;
    savePrefs();
    render();
  });
  document.getElementById("settingsBtn").addEventListener("click", openSettings);

  document.getElementById("app").addEventListener("click", function (e) {
    var act = e.target.closest("[data-act]");
    if (act) {
      var a = act.dataset.act;
      if (a === "new") { openEditor("new"); return; }
      if (a === "export") { exportCSV(); return; }
      if (a === "open-settings") { openSettings(); return; }
      if (a === "clear-examples") { clearExamples(); return; }
      if (a === "new-scenario") { newScenario(); return; }
      if (a === "del-scenario") { deleteScenario(); return; }
      if (a === "fill") { fillToTarget(); return; }
      if (a === "select-all") { setSelection(pickable().map(function (t) { return t.id; })); return; }
      if (a === "select-none") { setSelection([]); return; }
    }
    var sortTh = e.target.closest("th[data-sort]");
    if (sortTh) {
      var k = sortTh.dataset.sort;
      if (state.sort.key === k) state.sort.dir = state.sort.dir === "asc" ? "desc" : "asc";
      else state.sort = { key: k, dir: k === "amount" ? "desc" : "asc" };
      savePrefs(); render(); return;
    }
    var scen = e.target.closest("[data-scen]");
    if (scen) { state.activeScenario = scen.dataset.scen; savePrefs(); render(); return; }
    var pick = e.target.closest("[data-pick]");
    if (pick) { togglePick(pick.dataset.pick); return; }
    var row = e.target.closest("[data-id]");
    if (row) { openEditor(row.dataset.id); return; }
  });

  document.getElementById("app").addEventListener("keydown", function (e) {
    var pick = e.target.closest("[data-pick]");
    if (pick && (e.key === "Enter" || e.key === " ")) { e.preventDefault(); togglePick(pick.dataset.pick); }
  });

  document.getElementById("app").addEventListener("input", function (e) {
    var id = e.target.id;
    if (id === "fq") { state.filter.q = e.target.value; debounceRender(); }
    else if (id === "raiseTarget") { debounceScenario("target", e.target.value); }
    else if (id === "raiseEquity") { debounceScenario("equityPct", e.target.value); }
  });
  document.getElementById("app").addEventListener("change", function (e) {
    var id = e.target.id;
    if (id === "fstage") { state.filter.stage = e.target.value; render(); }
    else if (id === "fowner") { state.filter.owner = e.target.value; render(); }
    else if (id === "showPassed" || id === "showPassed2") { state.showPassed = e.target.checked; render(); }
  });

  var rt = null;
  function debounceRender() {
    clearTimeout(rt);
    rt = setTimeout(function () {
      var el = document.getElementById("fq");
      var pos = el ? el.selectionStart : null;
      render();
      var el2 = document.getElementById("fq");
      if (el2) { el2.focus(); if (pos != null) el2.setSelectionRange(pos, pos); }
    }, 220);
  }
  var tt = null;
  function debounceScenario(key, v) {
    clearTimeout(tt);
    tt = setTimeout(function () {
      var patch = {};
      patch[key] = num(v);
      saveActiveScenario(patch);
    }, 500);
  }

  document.getElementById("overlay").addEventListener("click", function (e) {
    var act = e.target.closest("[data-act]");
    if (act) {
      var a = act.dataset.act;
      if (a === "close") { closeOverlay(); return; }
      if (a === "save") { saveTarget(); return; }
      if (a === "delete") { deleteTarget(); return; }
      if (a === "add-comment") { addComment(); return; }
      if (a === "add-team") { readSettingsFromDOM(); state.modal.draft.team.push("New person"); renderSettings(); return; }
      if (a === "add-stage") {
        readSettingsFromDOM();
        var n = state.modal.draft.stages.length;
        state.modal.draft.stages.push({ id: newId("s_"), name: "New stage", colour: STAGE_COLOURS[n % STAGE_COLOURS.length], closed: false, dead: false });
        renderSettings(); return;
      }
      if (a === "save-settings") { saveSettings(); return; }
    }
    var inst = e.target.closest("[data-inst]");
    if (inst) { readDraftFromDOM(); state.draft.instrument = inst.dataset.inst; renderEditor(); return; }
    var rmTeam = e.target.closest("[data-rm-team]");
    if (rmTeam) {
      readSettingsFromDOM();
      var ti = +rmTeam.dataset.rmTeam;
      if (state.modal.draft.team.length <= 1) { toast("Keep at least one person on the team."); return; }
      state.modal.draft.team.splice(ti, 1); renderSettings(); return;
    }
    var rmStage = e.target.closest("[data-rm-stage]");
    if (rmStage) {
      readSettingsFromDOM();
      var si = +rmStage.dataset.rmStage;
      var st = state.modal.draft.stages[si];
      var used = targetList().filter(function (t) { return t.stage === st.id; }).length;
      if (used) { toast(used + " target" + (used === 1 ? " sits" : "s sit") + " in " + st.name + ". Move them first."); return; }
      if (state.modal.draft.stages.length <= 2) { toast("Keep at least two stages."); return; }
      state.modal.draft.stages.splice(si, 1); renderSettings(); return;
    }
    var mv = e.target.closest("[data-mv-stage]");
    if (mv) {
      readSettingsFromDOM();
      var i = +mv.dataset.mvStage, dir = +mv.dataset.dir, j = i + dir;
      var arr = state.modal.draft.stages;
      if (j < 0 || j >= arr.length) return;
      var tmp = arr[i]; arr[i] = arr[j]; arr[j] = tmp;
      renderSettings(); return;
    }
  });

  document.getElementById("overlay").addEventListener("input", function (e) {
    if (!state.draft || !e.target.closest(".sheet") || !e.target.dataset || !e.target.dataset.k) return;
    readDraftFromDOM();
    var hint = document.getElementById("capHint");
    if (hint) hint.innerHTML = capFieldHint(state.draft);
    var prev = document.getElementById("notePreview");
    if (prev) prev.innerHTML = conversionPreview(state.draft);
  });

  document.getElementById("overlay").addEventListener("keydown", function (e) {
    if (e.key === "Enter" && e.target.id === "e_comment") { e.preventDefault(); addComment(); }
  });
  document.addEventListener("keydown", function (e) {
    if (e.key === "Escape" && (state.editing || state.modal)) closeOverlay();
  });

  /* ---------- actions ---------- */

  function pickable() {
    return targetList().filter(function (t) { return state.showPassed || !stageById(t.stage).dead; });
  }
  function setSelection(ids) { saveActiveScenario({ selected: ids }); }
  function togglePick(id) {
    var sel = (activeScenario().selected || []).slice();
    var i = sel.indexOf(id);
    if (i === -1) sel.push(id); else sel.splice(i, 1);
    setSelection(sel);
  }
  function fillToTarget() {
    var scen = activeScenario();
    var target = num(scen.target) || 0;
    if (!target) { toast("Set a target raise first."); return; }
    var sel = (scen.selected || []).slice();
    var total = targetList().filter(function (t) { return sel.indexOf(t.id) !== -1; })
      .reduce(function (a, t) { return a + toGBP(t.amount, t.currency); }, 0);
    var rest = pickable().filter(function (t) { return sel.indexOf(t.id) === -1 && t.amount; })
      .sort(function (a, b) { return toGBP(b.amount, b.currency) - toGBP(a.amount, a.currency); });
    for (var i = 0; i < rest.length && total < target; i++) {
      sel.push(rest[i].id);
      total += toGBP(rest[i].amount, rest[i].currency);
    }
    setSelection(sel);
    if (total < target) toast("Every available target selected and still short of the number.");
  }
  async function newScenario() {
    var name = prompt("Name this scenario", "Scenario " + (scenarioList().length + 1));
    if (!name) return;
    var id = newId("sc_");
    var from = activeScenario();
    var ok = await putScenario(id, { name: name, target: from.target || null, equityPct: from.equityPct || null, selected: (from.selected || []).slice() });
    if (ok) { state.activeScenario = id; savePrefs(); render(); }
  }
  async function deleteScenario() {
    var s = activeScenario();
    if (s.virtual) return;
    if (!confirm("Delete the scenario “" + s.name + "”? The targets themselves are not affected.")) return;
    await removeScenario(s.id);
    state.activeScenario = "base";
    savePrefs(); render();
  }
  async function saveTarget() {
    readDraftFromDOM();
    var d = state.draft;
    if (!d.name || !d.name.trim()) { toast("Give the target a name."); var n = document.getElementById("e_name"); if (n) n.focus(); return; }
    var id = state.editing === "new" ? newId("t_") : state.editing;
    delete d.id;
    var ok = await putTarget(id, d);
    if (ok) { closeOverlay(); toast(state.editing === "new" ? "Target added." : "Saved."); }
  }
  async function deleteTarget() {
    if (!confirm("Delete “" + (state.draft.name || "this target") + "”? This cannot be undone.")) return;
    var ok = await removeTarget(state.editing);
    if (ok) { closeOverlay(); toast("Target deleted."); }
  }
  function addComment() {
    var box = document.getElementById("e_comment");
    var who = document.getElementById("e_cauthor");
    if (!box || !box.value.trim()) return;
    readDraftFromDOM();
    state.draft.comments.push({ date: todayISO(), author: who ? who.value : "", text: box.value.trim() });
    if (!state.draft.lastConversationDate) state.draft.lastConversationDate = todayISO();
    renderEditor();
    var again = document.getElementById("e_comment");
    if (again) again.focus();
  }
  async function saveSettings() {
    readSettingsFromDOM();
    var s = state.modal.draft;
    s.team = s.team.map(function (m) { return String(m).trim(); }).filter(Boolean);
    if (!s.team.length) s.team = ["Unassigned"];
    var ok = await putSettings(s);
    if (ok) { closeOverlay(); toast("Settings saved."); }
  }
  async function clearExamples() {
    var ex = targetList().filter(function (t) { return t.isExample; });
    if (!ex.length) return;
    if (!confirm("Delete the " + ex.length + " example records?")) return;
    for (var i = 0; i < ex.length; i++) await removeTarget(ex[i].id);
    toast("Examples removed.");
  }

  /* ============================ boot ============================ */

  loadPrefs();
  render();
  initStore();
})();
</script>
